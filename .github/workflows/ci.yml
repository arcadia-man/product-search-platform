name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:9.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: product_search
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      opensearch:
        image: opensearchproject/opensearch:3
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "CI-Only-Strong-Search-Pass-2026!"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/product_search
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      DB_URL: jdbc:mysql://127.0.0.1:3306/product_search
      DB_USER: root
      DB_PASSWORD: password
      OPENSEARCH_HOST: http://127.0.0.1:9200

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Wait for OpenSearch
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "OpenSearch did not become ready in time."
          exit 1

      - name: Initialize database schema and seed data
        run: mvn -B -ntp -f product-service/pom.xml -Dtest=ProductServiceApplicationTests test

      - name: Run full MySQL-to-OpenSearch sync
        run: >-
          mvn -B -ntp -f search-indexer/pom.xml spring-boot:run
          -Dspring-boot.run.arguments=--search-indexer.full-sync-on-startup=true,--search-indexer.exit-on-complete=true,--spring.main.web-application-type=none,--spring.kafka.admin.auto-create=false

      - name: Verify the full sync created an index alias and documents
        run: |
          curl --fail --silent http://127.0.0.1:9200/_alias/products \
            | jq --exit-status 'length > 0'
          curl --fail --silent http://127.0.0.1:9200/products/_count \
            | jq --exit-status '.count > 0'

      - name: Verify product-service
        run: mvn -B -ntp -f product-service/pom.xml verify

      - name: Verify search-indexer
        run: mvn -B -ntp -f search-indexer/pom.xml verify
