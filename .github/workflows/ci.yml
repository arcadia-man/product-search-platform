name: Pre-Merge CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Stage 1: Build, Hermetic Unit Testing & Artifact Packaging (Matrix)
  # =========================================================================
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, search-indexer]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Compile and run hermetic unit tests
        run: mvn -B -ntp -f ${{ matrix.service }}/pom.xml test

      - name: Verify package artifact creation
        run: mvn -B -ntp -f ${{ matrix.service }}/pom.xml package -DskipTests

  # =========================================================================
  # Stage 2: Code Quality & Static Analysis (SonarQube Ready)
  # =========================================================================
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Verify clean compilation and check warnings
        run: |
          mvn -B -ntp -f product-service/pom.xml compile
          mvn -B -ntp -f search-indexer/pom.xml compile

      - name: SonarQube / Quality Gate (if SONAR_TOKEN configured)
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "Running SonarQube analysis..."
          mvn -B -ntp -f product-service/pom.xml sonar:sonar || true
          mvn -B -ntp -f search-indexer/pom.xml sonar:sonar || true
