spring.application.name=search-indexer
server.port=8081

# MySQL Datasource (supports CI and local environment variables)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/product_search}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:password}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# OpenSearch Configuration
opensearch.host=${OPENSEARCH_HOST:http://localhost:9200}
opensearch.index=products

# Pipeline & Sync Configuration
search-indexer.batch-size=100
search-indexer.full-sync-on-startup=false
search-indexer.exit-on-complete=false
search-indexer.cdc.enabled=false
search-indexer.cdc.topic=product-changes
search-indexer.cdc.dlt-topic=product-changes.DLT
search-indexer.cdc.concurrency=2
search-indexer.cdc.retry-interval-ms=1000
search-indexer.cdc.max-retries=3

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=product-search-indexer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:50}
search-indexer.cdc.max-poll-interval-ms=600000
