spring.application.name=search-indexer
opensearch.host=http://localhost:9200
opensearch.index=products
search-indexer.full-sync-on-startup=false
search-indexer.batch-size=100
search-indexer.cdc.enabled=false
search-indexer.cdc.topic=product-changes
search-indexer.cdc.dlt-topic=product-changes.DLT
search-indexer.cdc.concurrency=2
search-indexer.cdc.retry-interval-ms=1000
search-indexer.cdc.max-retries=3

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_search}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=8

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=product-search-indexer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:50}
search-indexer.cdc.max-poll-interval-ms=600000